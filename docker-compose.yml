# One command for the whole stack: `docker compose up --build`.
# Brings up Postgres, the Quarkus backend, and the nginx-served frontend.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      POSTGRES_DB: airport
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airport -d airport']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      QUARKUS_DATASOURCE_USERNAME: airport
      QUARKUS_DATASOURCE_PASSWORD: airport
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/airport
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '8088:80'

volumes:
  db-data:

# One command for the whole stack: `docker compose up --build`.
# Brings up Postgres, the Quarkus backend, and the nginx-served frontend. The same file runs locally and on the
# droplet; only `.env` differs there (HTTP_PORT=80). See .env.example and scripts/redeploy.sh.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      POSTGRES_DB: airport
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airport -d airport']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_USERNAME: airport
      QUARKUS_DATASOURCE_PASSWORD: airport
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/airport
      # Creative assistant: mock (offline, default) or llm. For llm, any OpenAI-compatible endpoint.
      APP_CREATIVE_ASSISTANT_PROVIDER: ${APP_CREATIVE_ASSISTANT_PROVIDER:-mock}
      # Quarkus rejects an empty value, so unset vars fall back to the same defaults as application.properties.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1/}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    # Loopback only: browsers reach the API through the frontend's nginx (/api). Locally the Vite dev server
    # proxies to it; on the droplet it is not exposed to the internet.
    ports:
      - '127.0.0.1:8080:8080'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${HTTP_PORT:-8088}:80'

volumes:
  db-data:

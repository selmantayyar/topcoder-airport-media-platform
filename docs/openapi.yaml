info:
  title: Airport Retail Media Platform API
  version: "1.0"
  description: "REST + SSE API of the airport retail media POC: screens and playback,\
    \ the decision pipeline, promo claims, retailer/media-manager/airline/admin views\
    \ and the simulation controls. No authentication: roles are UI personas only.\
    \ Live updates stream from GET /api/stream (Server-Sent Events)."

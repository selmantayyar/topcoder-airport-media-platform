# HTTP. No CORS config: the browser always reaches the backend same-origin — via
# the nginx proxy in docker compose, and via the Vite dev-server proxy locally.
quarkus.http.port=8080

# Database. No JDBC URL is set here on purpose: `quarkus dev` and tests get a
# throwaway Postgres via Dev Services/Testcontainers. docker compose overrides
# QUARKUS_DATASOURCE_* via environment variables.
quarkus.datasource.db-kind=postgresql

# Schema is owned by Flyway migrations, not Hibernate auto-generation.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

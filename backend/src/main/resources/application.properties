# HTTP. No CORS config: the browser always reaches the backend same-origin — via
# the nginx proxy in docker compose, and via the Vite dev-server proxy locally.
quarkus.http.port=8080

# Database. No JDBC URL is set here on purpose: `quarkus dev` and tests get a
# throwaway Postgres via Dev Services/Testcontainers. docker compose overrides
# QUARKUS_DATASOURCE_* via environment variables.
quarkus.datasource.db-kind=postgresql

# Schema is owned by Flyway migrations, not Hibernate auto-generation.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
# snake_case column/table names so hand-written DDL matches the entities.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Simulation clock (ticket 04). The day starts paused just before the Gate 42 example.
app.sim.start=2026-10-23T14:00:00Z

# Adapter wiring (ticket 03). Each external source is swappable mock|live.
app.flight.source=mock
app.aidx.source=mock
app.acris.source=mock

# Decision pipeline (ticket 06). Every online screen re-decides every ~15 sim-seconds; the loop
# ticks in real time and processes a bounded batch of due screens (see ADR 0004 for the trade-off).
app.decision.tick=2s
app.decision.interval-sim-seconds=15
app.decision.screen-batch=40
app.decision.frequency-window-minutes=60
app.decision.impression-cost=0.5

# Retailer dashboard (ticket 08). Attributed revenue = redemptions x average basket value.
app.retail.avg-basket=45.0

# Platform Admin console (ticket 10). Revenue is shown in a configurable currency: the money model
# is in USD (app.retail / app.decision), converted at currency-rate. Feeds silent longer than
# feed-lag-minutes raise an incident; the monitor scans every incident-tick.
app.admin.currency=USD
app.admin.currency-rate=1.0
app.admin.feed-lag-minutes=60
app.admin.incident-tick=3s

# Tests drive the pipeline directly, so the background loop stays off.
%test.quarkus.scheduler.enabled=false

# Seed the fictional airport-day on startup when the DB is empty.
app.seed.on-start=true
app.seed.flights=900
app.seed.screens=180
app.seed.outlets=40
app.seed.campaigns=25
app.seed.history-days=30

# Tests seed a small airport so the suite stays fast.
%test.app.seed.flights=40
%test.app.seed.screens=20
%test.app.seed.outlets=8
%test.app.seed.campaigns=6
%test.app.seed.history-days=2
